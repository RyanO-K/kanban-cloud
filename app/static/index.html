<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kanban-cloud</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f24; --muted: #6b7280;
    --accent: #2563eb; --border: #d8dce3; --ok: #16a34a; --bad: #dc2626;
    --overlay: rgba(0,0,0,.35); --col-bg: #ebedf0; --badge-bg: #eef2ff;
  }
  body.dark {
    --bg: #14161a; --panel: #1d2025; --ink: #e6e8eb; --muted: #9aa2ad;
    --accent: #5b8def; --border: #33383f; --ok: #22c55e; --bad: #ef4444;
    --overlay: rgba(0,0,0,.6); --col-bg: #23262c; --badge-bg: #232a3d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select, input, textarea, button { font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--ink); }
  button { cursor: pointer; background: var(--accent); color: #fff; border: none; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.small { padding: 3px 8px; font-size: 12px; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 12px; }
  .layout { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
  .board { display: flex; gap: 10px; flex: 1; overflow-x: auto; }
  .col { background: var(--col-bg); border-radius: 8px; min-width: 210px; width: 210px; padding: 8px; }
  .col h3 { margin: 2px 4px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); display: flex; justify-content: space-between; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
  .card:hover { border-color: var(--accent); }
  .card .tid { color: var(--muted); font-size: 11px; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--badge-bg); color: var(--accent); margin-top: 4px; }
  .side { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; }
  .worker-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.on { background: var(--ok); }
  /* modal */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border-radius: 10px; padding: 18px; width: min(560px, 92vw); max-height: 88vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 10px; font-size: 17px; }
  .modal label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
  .modal input, .modal textarea, .modal select { width: 100%; }
  .modal textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .comment { border-top: 1px solid var(--border); padding: 6px 0; font-size: 13px; }
  .comment .who { font-weight: 600; font-size: 12px; }
  #authView { max-width: 360px; margin: 60px auto; }
  /* spectator (read-only) mode: hide every mutating control */
  body.spectator .owner-only { display: none !important; }
  #spectatorNote { display: none; font-size: 12px; color: var(--muted); }
  body.spectator #spectatorNote { display: inline; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1b1f24; color: #fff; padding: 8px 16px; border-radius: 8px; display: none; z-index: 20; }
  /* account/profile dropdown */
  .accountWrap { position: relative; }
  #accountBtn { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--ink); border: 1px solid var(--border); }
  #accountMenu { display: none; position: absolute; top: calc(100% + 6px); right: 0; min-width: 190px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 6px; z-index: 15; }
  #accountMenu.show { display: block; }
  #accountMenu .menuEmail { padding: 6px 8px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  #accountMenu button.menuItem { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: transparent; color: var(--ink); border: none; padding: 7px 8px; border-radius: 6px; font-size: 13px; }
  #accountMenu button.menuItem:hover { background: var(--col-bg); }
</style>
</head>
<body>

<div id="authView" class="panel" style="display:none">
  <h2>kanban-cloud</h2>
  <label>Email</label><input id="authEmail" type="email" style="width:100%">
  <label>Password</label><input id="authPass" type="password" style="width:100%">
  <div class="row">
    <button onclick="login()">Log in</button>
    <button class="ghost" onclick="registerUser()">Register</button>
  </div>
  <p class="muted" id="authMsg"></p>
</div>

<div id="appView" style="display:none">
  <header>
    <h1>kanban-cloud</h1>
    <select id="clusterSel" onchange="switchCluster()"></select>
    <select id="boardSel" onchange="loadBoard()"></select>
    <button class="small ghost owner-only" onclick="openClusterModal()">+ cluster</button>
    <button class="small ghost owner-only" onclick="newBoard()">+ board</button>
    <button class="small owner-only" onclick="openTicketModal(null)">+ ticket</button>
    <div class="spacer"></div>
    <span id="spectatorNote">viewing read-only</span>
    <div class="accountWrap">
      <button class="small" id="accountBtn" onclick="toggleAccountMenu()">
        <span id="whoami"></span><span>▾</span>
      </button>
      <div id="accountMenu">
        <div class="menuEmail" id="menuEmail"></div>
        <button class="menuItem" id="signInBtn" style="display:none" onclick="signIn()">Sign in with GitHub</button>
        <button class="menuItem" id="darkModeItem" onclick="toggleDarkMode()">
          <span>Dark mode</span><span id="darkModeState"></span>
        </button>
        <button class="menuItem" id="logoutBtn" onclick="logout()">Log out</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <div class="board" id="board"></div>
    <div class="side">
      <div class="panel">
        <h3>Workers</h3>
        <div id="workersPanel" class="muted">–</div>
        <p class="muted owner-only" style="margin-bottom:0">Join code: <b id="joinCode">–</b><br>
        Start a PC: <code style="font-size:11px">py worker.py --enroll --server &lt;url&gt; --join-code &lt;code&gt;</code></p>
      </div>
      <div class="panel owner-only">
        <h3>Settings</h3>
        <label class="muted">Cluster Claude API key</label>
        <input id="apiKeyInput" type="password" placeholder="sk-ant-..." style="width:100%; margin:4px 0">
        <div class="row" style="margin-top:6px">
          <button class="small" onclick="saveApiKey()">Save key</button>
          <span class="muted" id="apiKeyState"></span>
        </div>
        <p class="muted">Stored server-side; readable by this cluster's enrolled worker PCs. It is never shown here again.</p>
      </div>
      <div class="panel">
        <h3>Recent delegations</h3>
        <div id="queuePanel" class="muted" style="font-size:12px">–</div>
      </div>
    </div>
  </div>
</div>

<!-- ticket modal -->
<div class="overlay" id="ticketOverlay" onclick="if(event.target===this) closeTicketModal()">
  <div class="modal">
    <h2 id="ticketModalTitle">Ticket</h2>
    <label>Title</label><input id="tTitle">
    <label>Details</label><textarea id="tBody"></textarea>
    <label>Status</label>
    <select id="tStatus">
      <option value="todo">todo</option>
      <option value="ready">ready (queue for agent)</option>
      <option value="doing">doing</option>
      <option value="review">review</option>
      <option value="done">done</option>
      <option value="failed">failed</option>
    </select>
    <label>Run on</label>
    <select id="tTarget"><option value="">any worker</option></select>
    <div class="row owner-only">
      <button onclick="saveTicket()">Save</button>
      <button class="ghost" id="runBtn" onclick="runTicket()">Run on agent now</button>
      <div class="spacer"></div>
      <button class="ghost" style="color:var(--bad); border-color:var(--bad)" id="delBtn" onclick="deleteTicket()">Delete</button>
    </div>
    <div id="commentsWrap" style="margin-top:14px">
      <h3 style="font-size:13px; margin:0 0 4px">Comments</h3>
      <div id="comments"></div>
      <div class="row owner-only">
        <input id="newComment" placeholder="Add a comment..." style="flex:1">
        <button class="small" onclick="addComment()">Post</button>
      </div>
    </div>
  </div>
</div>

<!-- cluster modal -->
<div class="overlay" id="clusterOverlay" onclick="if(event.target===this) this.classList.remove('show')">
  <div class="modal">
    <h2>Clusters</h2>
    <label>Create a new cluster</label>
    <div class="row" style="margin-top:0"><input id="newClusterName" placeholder="Team name" style="flex:1"><button class="small" onclick="createCluster()">Create</button></div>
    <label>Or join with a code</label>
    <div class="row" style="margin-top:0"><input id="joinCodeInput" placeholder="ABC12345" style="flex:1"><button class="small" onclick="joinCluster()">Join</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
const COLS = ["todo", "ready", "doing", "review", "done", "failed"];
let token = localStorage.getItem("kc_token") || null;
let clusters = [], boards = [], tickets = [], workers = [];
let currentCluster = null, currentBoard = null, editingTicket = null;
// 'local' (dev: login UI) | 'owner' (proxy-authenticated, full rights)
// | 'spectator' (proxy, read-only). Set once at boot from ./api/session.
let sessionMode = "local";
// Board the server told a spectator to land on (the demo board when one
// exists). Null in owner/local mode, where the first board still wins.
let sessionBoardId = null;

// ---------- theme ----------
function applyDarkMode(on) {
  document.body.classList.toggle("dark", on);
  const s = document.getElementById("darkModeState");
  if (s) s.textContent = on ? "On" : "Off";
}
function initTheme() {
  const stored = localStorage.getItem("kc_theme");
  const on = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyDarkMode(on);
}
function toggleDarkMode() {
  const on = !document.body.classList.contains("dark");
  applyDarkMode(on);
  localStorage.setItem("kc_theme", on ? "dark" : "light");
}
initTheme();

// ---------- account menu ----------
function toggleAccountMenu() {
  document.getElementById("accountMenu").classList.toggle("show");
}
document.addEventListener("click", (ev) => {
  const wrap = document.querySelector(".accountWrap");
  if (wrap && !wrap.contains(ev.target)) document.getElementById("accountMenu").classList.remove("show");
});
function signIn() {
  if (signIn.url) location.href = signIn.url;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

async function api(method, path, body) {
  // Paths are RELATIVE ("./api/...") so the app works both at "/" and when
  // reverse-proxied under a prefix like "/board/".
  const resp = await fetch(path, {
    method,
    headers: Object.assign({"Content-Type": "application/json"},
      token ? {"Authorization": "Bearer " + token} : {}),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (resp.status === 401 && sessionMode === "local" && path !== "./api/login") { logout(); throw new Error("unauthorized"); }
  if (!resp.ok) {
    let d = "request failed";
    try { d = (await resp.json()).detail || d; } catch {}
    toast(d); throw new Error(d);
  }
  return resp.json();
}

// ---------- auth ----------
async function login() {
  try {
    const r = await api("POST", "./api/login", {
      email: document.getElementById("authEmail").value,
      password: document.getElementById("authPass").value });
    token = r.token; localStorage.setItem("kc_token", token); init();
  } catch (e) { document.getElementById("authMsg").textContent = "Login failed."; }
}
async function registerUser() {
  try {
    const r = await api("POST", "./api/register", {
      email: document.getElementById("authEmail").value,
      password: document.getElementById("authPass").value });
    token = r.token; localStorage.setItem("kc_token", token); init();
  } catch (e) { document.getElementById("authMsg").textContent = "Registration failed."; }
}
function logout() {
  token = null; localStorage.removeItem("kc_token");
  document.getElementById("appView").style.display = "none";
  document.getElementById("authView").style.display = "block";
}

// ---------- clusters/boards ----------
async function init() {
  let me;
  try { me = await api("GET", "./api/me"); } catch { return; }
  document.getElementById("authView").style.display = "none";
  document.getElementById("appView").style.display = "block";
  document.getElementById("whoami").textContent = me.email;
  document.getElementById("menuEmail").textContent = me.email;
  clusters = await api("GET", "./api/clusters");
  const sel = document.getElementById("clusterSel");
  sel.innerHTML = clusters.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  if (!clusters.length) { openClusterModal(); return; }
  currentCluster = clusters.find(c => c.id == (localStorage.getItem("kc_cluster") || clusters[0].id)) || clusters[0];
  sel.value = currentCluster.id;
  await refreshClusterBits();
}

async function switchCluster() {
  currentCluster = clusters.find(c => c.id == document.getElementById("clusterSel").value);
  localStorage.setItem("kc_cluster", currentCluster.id);
  await refreshClusterBits();
}

async function refreshClusterBits() {
  document.getElementById("joinCode").textContent = currentCluster.join_code || "–";
  boards = await api("GET", `./api/clusters/${currentCluster.id}/boards`);
  const bs = document.getElementById("boardSel");
  bs.innerHTML = boards.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join("");
  currentBoard = boards.find(b => b.id === sessionBoardId) || boards[0] || null;
  if (currentBoard) bs.value = currentBoard.id;
  const jobs = [loadBoard(), loadWorkers(), loadQueue()];
  if (sessionMode !== "spectator") jobs.push(loadSettings());  // settings GET is 403 for spectators
  await Promise.all(jobs);
}

function openClusterModal() { document.getElementById("clusterOverlay").classList.add("show"); }
async function createCluster() {
  const name = document.getElementById("newClusterName").value.trim();
  if (!name) return;
  await api("POST", "./api/clusters", {name});
  document.getElementById("clusterOverlay").classList.remove("show");
  init();
}
async function joinCluster() {
  const code = document.getElementById("joinCodeInput").value.trim();
  if (!code) return;
  await api("POST", "./api/clusters/join", {join_code: code});
  document.getElementById("clusterOverlay").classList.remove("show");
  init();
}
async function newBoard() {
  const name = prompt("Board name:");
  if (!name) return;
  await api("POST", `./api/clusters/${currentCluster.id}/boards`, {name});
  refreshClusterBits();
}

// ---------- board ----------
async function loadBoard() {
  const bs = document.getElementById("boardSel");
  currentBoard = boards.find(b => b.id == bs.value) || boards[0];
  if (!currentBoard) { document.getElementById("board").innerHTML = ""; return; }
  tickets = await api("GET", `./api/boards/${currentBoard.id}/tickets`);
  const el = document.getElementById("board");
  el.innerHTML = COLS.map(col => {
    const cards = tickets.filter(t => t.status === col).map(t => `
      <div class="card" onclick="openTicketModal(${t.id})" draggable="${sessionMode !== "spectator"}"
           ondragstart="event.dataTransfer.setData('text/plain','${t.id}')">
        <div class="tid">#${t.id}${t.target_worker ? " → " + esc(workerName(t.target_worker)) : ""}</div>
        <div>${esc(t.title)}</div>
        ${t.assigned_worker && (t.status === "doing") ? `<span class="badge">on ${esc(workerName(t.assigned_worker))}</span>` : ""}
        ${t.comments.length ? `<span class="badge">${t.comments.length} 💬</span>` : ""}
      </div>`).join("");
    return `<div class="col" ondragover="event.preventDefault()" ondrop="dropTicket(event,'${col}')">
      <h3><span>${col}</span><span>${tickets.filter(t => t.status === col).length}</span></h3>${cards}</div>`;
  }).join("");
}

async function dropTicket(ev, col) {
  ev.preventDefault();
  if (sessionMode === "spectator") return;
  const id = ev.dataTransfer.getData("text/plain");
  await api("PATCH", `./api/tickets/${id}`, {status: col});
  if (col === "ready") toast("Queued for agent");
  loadBoard(); loadQueue();
}

function workerName(id) {
  const w = workers.find(w => w.id === id);
  return w ? w.name : "worker " + id;
}

// ---------- ticket modal ----------
function openTicketModal(id) {
  editingTicket = id === null ? null : tickets.find(t => t.id === id);
  const readOnly = sessionMode === "spectator";
  ["tTitle", "tBody", "tStatus", "tTarget"].forEach(x => document.getElementById(x).disabled = readOnly);
  document.getElementById("ticketModalTitle").textContent = editingTicket ? `Ticket #${editingTicket.id}` : "New ticket";
  document.getElementById("tTitle").value = editingTicket ? editingTicket.title : "";
  document.getElementById("tBody").value = editingTicket ? editingTicket.body : "";
  document.getElementById("tStatus").value = editingTicket ? editingTicket.status : "todo";
  const tgt = document.getElementById("tTarget");
  tgt.innerHTML = `<option value="">any worker</option>` +
    workers.filter(w => !w.revoked).map(w => `<option value="${w.id}">${esc(w.name)}${w.online ? "" : " (offline)"}</option>`).join("");
  tgt.value = editingTicket && editingTicket.target_worker ? editingTicket.target_worker : "";
  document.getElementById("delBtn").style.display = editingTicket ? "" : "none";
  document.getElementById("runBtn").style.display = editingTicket ? "" : "none";
  document.getElementById("commentsWrap").style.display = editingTicket ? "" : "none";
  if (editingTicket) renderComments(editingTicket);
  document.getElementById("ticketOverlay").classList.add("show");
}
function closeTicketModal() { document.getElementById("ticketOverlay").classList.remove("show"); }

function renderComments(t) {
  document.getElementById("comments").innerHTML = t.comments.map(c => `
    <div class="comment"><span class="who">${esc(c.writer)}</span>
    <span class="muted">${c.timestamp.slice(0, 16).replace("T", " ")}</span><br>${esc(c.message)}</div>`).join("")
    || `<p class="muted">No comments yet.</p>`;
}

async function saveTicket() {
  const payload = {
    title: document.getElementById("tTitle").value,
    body: document.getElementById("tBody").value,
    status: document.getElementById("tStatus").value,
  };
  const tgt = document.getElementById("tTarget").value;
  if (tgt) payload.target_worker = parseInt(tgt); else payload.clear_target = true;
  if (editingTicket) {
    await api("PATCH", `./api/tickets/${editingTicket.id}`, payload);
  } else {
    delete payload.clear_target;
    await api("POST", `./api/boards/${currentBoard.id}/tickets`, payload);
  }
  closeTicketModal(); loadBoard(); loadQueue();
}
async function runTicket() {
  if (!editingTicket) return;
  await api("POST", `./api/tickets/${editingTicket.id}/run`);
  toast("Queued for agent"); closeTicketModal(); loadBoard(); loadQueue();
}
async function deleteTicket() {
  if (!editingTicket || !confirm("Delete ticket #" + editingTicket.id + "?")) return;
  await api("DELETE", `./api/tickets/${editingTicket.id}`);
  closeTicketModal(); loadBoard();
}
async function addComment() {
  const msg = document.getElementById("newComment").value.trim();
  if (!msg || !editingTicket) return;
  const t = await api("POST", `./api/tickets/${editingTicket.id}/comments`, {message: msg});
  document.getElementById("newComment").value = "";
  editingTicket = t; renderComments(t); loadBoard();
}

// ---------- side panels ----------
async function loadWorkers() {
  workers = await api("GET", `./api/clusters/${currentCluster.id}/workers`);
  document.getElementById("workersPanel").innerHTML = workers.length
    ? workers.map(w => `<div class="worker-row"><span class="dot ${w.online && !w.revoked ? "on" : ""}"></span>
        <b>${esc(w.name)}</b>
        ${w.revoked ? '<span class="muted">(revoked)</span>'
          : `<span class="muted">${w.online ? w.status : "offline"}</span>
             <button class="ghost small owner-only" onclick="revokeWorker(${w.id})">Revoke</button>`}</div>`).join("")
    : `<span class="muted">No PCs enrolled yet. On the PC:<br>
       <code>py worker.py --enroll --server ${esc(enrollServer())} --join-code &lt;code&gt;</code></span>`;
}

function enrollServer() {
  // Through the proxy (owner/spectator), location.origin is okeefe.work — wrong
  // for enrollment, which must target the Render service directly.
  return (sessionMode === "owner" || sessionMode === "spectator")
    ? "https://kanban-cloud.onrender.com" : location.origin;
}

async function revokeWorker(id) {
  if (!confirm("Revoke this PC's database access? It stops working immediately; re-enrolling restores it.")) return;
  await api("POST", `./api/workers/${id}/revoke`);
  await loadWorkers();
}
async function loadSettings() {
  const s = await api("GET", `./api/clusters/${currentCluster.id}/settings`);
  document.getElementById("apiKeyState").textContent =
    s.has_key ? "Saved: " + s.claude_api_key_masked : "No key set";
}
async function saveApiKey() {
  const v = document.getElementById("apiKeyInput").value.trim();
  if (!v) return;
  await api("PUT", `./api/clusters/${currentCluster.id}/settings`, {claude_api_key: v});
  document.getElementById("apiKeyInput").value = "";
  toast("API key saved"); loadSettings();
}
async function loadQueue() {
  const q = await api("GET", `./api/clusters/${currentCluster.id}/queue`);
  document.getElementById("queuePanel").innerHTML = q.length
    ? q.slice(0, 10).map(i => `<div>#${i.ticket_id} — ${i.status}${i.claimed_by ? " by " + esc(workerName(i.claimed_by)) : ""}</div>`).join("")
    : "No delegations yet.";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// periodic refresh of live bits (spectators keep polling too — live board)
setInterval(() => {
  if ((token || sessionMode !== "local") && currentCluster &&
      document.getElementById("appView").style.display !== "none") {
    loadWorkers(); loadQueue();
    if (!document.getElementById("ticketOverlay").classList.contains("show")) loadBoard();
  }
}, 5000);

// ---------- boot ----------
async function boot() {
  let s = {mode: "local"};
  try { s = await api("GET", "./api/session"); } catch (e) { /* old server: local */ }
  sessionMode = s.mode;
  if (sessionMode === "owner") {
    // Trusted proxy authenticates us; no login UI, no logout.
    document.getElementById("logoutBtn").style.display = "none";
    init();
    return;
  }
  if (sessionMode === "spectator") {
    document.body.classList.add("spectator");
    sessionBoardId = s.board ? s.board.id : null;
    if (s.login_url) {
      // A root-relative site path, deliberately not a ./api/ call: this
      // navigates out of the /board/ prefix to the site's own OAuth route.
      signIn.url = s.login_url;
      document.getElementById("signInBtn").style.display = "";
    }
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("authView").style.display = "none";
    document.getElementById("appView").style.display = "block";
    document.getElementById("whoami").textContent = "Spectator";
    document.getElementById("menuEmail").textContent = "Viewing read-only";
    const sel = document.getElementById("clusterSel");
    sel.disabled = true;
    currentCluster = s.cluster;  // {id, name} or null — from ./api/session
    if (!currentCluster) {
      sel.innerHTML = "";
      document.getElementById("board").innerHTML = `<p class="muted">Nothing to show yet.</p>`;
      return;
    }
    sel.innerHTML = `<option value="${currentCluster.id}">${esc(currentCluster.name)}</option>`;
    await refreshClusterBits();
    return;
  }
  if (token) init(); else logout();
}

boot();
</script>
</body>
</html>
